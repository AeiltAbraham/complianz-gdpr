# CI for the settings-UI redesign (feature 001, ADR-012).
#
# Runs what the local commit gate CANNOT: a from-source build and the whole-app
# characterization e2e suite on a FRESH WordPress environment — the condition that caught
# the fresh-DB determinism bug during Stage C. Coding standards (WPCS) and php -l are already
# enforced on every commit by the flow gate (.agent/gate.json), so they are not repeated here.
#
# Scope: build + static token/physical-utility checks + the e2e suite. The ADR-004 token
# checks (T-018) and the ADR-007 physical-utility check (T-016) run server-side here as well as
# in the local commit gate (defence in depth: a push without the hook, or a web edit, still gets
# checked). Stylelint on settings/src/styles/ is wired but non-blocking until T-020 creates that
# directory and its config. The e2e job needs Actions enabled on the fork (Settings -> Actions)
# and a Docker-capable runner (ubuntu-latest has Docker for @wordpress/env). Mark this workflow a
# required status check in branch protection (manual repo setting).
name: checks

on:
  push:
    branches: [ '001-settings-ui-redesign' ]
  pull_request:
    branches: [ '001-settings-ui-redesign' ]

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build from source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install settings dependencies
        run: npm ci --prefix settings
      - name: Build admin CSS and the settings bundle
        run: npm run build:all
      - name: Confirm the settings bundle externalises React and the WP packages
        # Guards FR-023: React/wp-* must stay external (provided by WordPress), never bundled.
        run: >-
          php -r '$f = glob("settings/build/index.*.asset.php"); $a = require $f[0];
          $want = array("lodash","react","react-dom","react-jsx-runtime","wp-api-fetch","wp-components","wp-data","wp-element","wp-i18n");
          exit($a["dependencies"] === $want ? 0 : 1);'
      - name: Token hygiene (ADR-004 / T-018)
        # Mirrors the two commit-gate token checks server-side. Each path is grepped only when it
        # EXISTS, inside an `if` condition (so Actions' `bash -e` never exits on grep's no-match or
        # a missing-path error), and any match sets fail=1; `exit $fail` gates. This avoids two
        # traps a terser form falls into: a non-final `! grep` is errexit-exempt (so it can never
        # gate), and grep over a not-yet-created sibling dir returns exit 2 (which `! grep` / an
        # `-ne 0` test wrongly treat as "clean"). settings/src/components|styles arrive in T-020+.
        run: |
          fail=0
          for p in assets/css/admin assets/css/admin.scss assets/css/variables.scss settings/src; do
            if [ -e "$p" ] && grep -r -n -e '--rsp-' -e '[$]rsp-' "$p"; then
              echo "::error::legacy --rsp-/\$rsp- token in $p (ADR-004)"; fail=1
            fi
          done
          for p in settings/src/components settings/src/styles; do
            if [ -d "$p" ] && grep -r -n -e '--cmplz-legacy-' "$p"; then
              echo "::error::--cmplz-legacy- token in new code $p (ADR-004)"; fail=1
            fi
          done
          exit $fail
      - name: Physical-utility check (ADR-007 / T-016)
        run: node settings/scripts/check-physical-utilities.js
      - name: Stylelint on settings/src/styles (non-blocking until T-020)
        # The directory and a stylelint config arrive in T-020; until then this is a clean no-op,
        # and continue-on-error keeps it from ever gating the run (T-020 removes that line).
        continue-on-error: true
        run: |
          if [ -d settings/src/styles ]; then
            npx --no-install stylelint "settings/src/styles/**/*.css"
          else
            echo "settings/src/styles/ does not exist yet (created in T-020) — stylelint is a no-op for now"
          fi

  e2e:
    name: Admin e2e suite (fresh WordPress)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install settings dependencies
        run: npm ci --prefix settings
      - name: Install the Playwright Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Build admin CSS and the settings bundle
        run: npm run build:all
      - name: Start the WordPress environments (latest + 5.9 floor)
        run: npx wp-env start
      - name: Run the admin Playwright projects
        # CI=true (set by Actions) switches on retries: 2 and forbidOnly in playwright.config.js.
        # The full-screen visual layer records drift non-blocking; functional specs gate the run.
        run: >-
          npm run e2e --
          --project=admin
          --project=admin-rtl
          --project=admin-min-wp
          --project=admin-i18n
      - name: Upload the Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
